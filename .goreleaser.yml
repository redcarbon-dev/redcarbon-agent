version: 2

project_name: redcarbon

release:
  prerelease: auto
  mode: keep-existing
  # release-please creates the release as a draft named after the tag; GoReleaser
  # uploads the assets into it and only then publishes it, so agents never see a
  # release without assets.
  use_existing_draft: true
  name_template: "{{ .Tag }}"

before:
  hooks:
    - go mod tidy

builds:
  - <<: &build_defaults
      binary: bin/redcarbon
      main: ./cmd
      ldflags:
        - -s -w -X pkg.redcarbon.ai/internal/build.Version={{.Version}} -X pkg.redcarbon.ai/internal/build.Architecture={{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }} -X pkg.redcarbon.ai/internal/build.DefaultHost={{.Env.API_HOST}}
      env:
        - CGO_ENABLED=0
    id: linux
    goos: [linux]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

archives:
  - id: nix
    ids: [linux, macos]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [tar.gz]
    files:
      - src: assets/*
        dst: .
      - src: templates/*
        dst: bin/templates
