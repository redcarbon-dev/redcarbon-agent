name: Releaser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  repository-projects: write

jobs:
  goreleaser:
    # `arc-default`: .goreleaser.yml has no `dockers:`/`docker_manifests:`/`ko:`
    # section — it only cross-compiles static binaries (CGO_ENABLED=0) for
    # linux/darwin amd64+arm64 and uploads tarballs to the GitHub release. No
    # image is built or pushed, so the privileged class is not needed.
    # goreleaser/goreleaser-action is `using: node24`.
    runs-on: arc-default
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Go 1.24
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: latest
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_HOST: ${{ secrets.API_HOST }}
