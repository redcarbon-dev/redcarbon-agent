name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    # `arc-default` (non-privileged, no docker socket): `go build`/`go test` only.
    # No ory/dockertest and no testcontainers anywhere in the module, so no
    # docker daemon is required. The runner image ships gcc/libc6-dev, so cgo
    # would work too.
    runs-on: arc-default
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
  protolint:
    # `arc-default`: all three buf actions are `using: node20` JavaScript
    # actions, not Docker container actions. buf-setup downloads the buf binary
    # and buf-breaking clones the `against` git input over HTTPS; runner egress
    # is unrestricted, so both work off the privileged class.
    runs-on: arc-default
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: bufbuild/buf-setup-action@v1.50.0
      - uses: bufbuild/buf-lint-action@v1.1.1
      - uses: bufbuild/buf-breaking-action@v1.1.4
        with:
          against: "https://github.com/${GITHUB_REPOSITORY}.git#branch=main"
