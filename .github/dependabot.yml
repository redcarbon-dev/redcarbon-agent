version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Etc/UTC"
    # Action bumps don't change the agent binary: keep them out of releases.
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 2
